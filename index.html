<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ot yo'li</title>
<style>
:root{
  --gold:#dcb446; --dark:#0f0f10; --panel:#242426; --panel2:#1a1a1c;
  --text:#f2ede1; --muted:#9a9690;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--dark); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  overflow-x:hidden; min-height:100%;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.screen{width:100%; max-width:520px; display:none; flex-direction:column; align-items:center; padding:24px 16px;}
.screen.active{display:flex;}

/* splash */
#splash{justify-content:center; min-height:100vh; gap:14px; text-align:center;}
.crest{width:96px; height:auto; filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));}
h1.title{font-size:26px; letter-spacing:.5px; margin:0 0 4px; color:var(--gold);}
.subtitle{color:var(--muted); font-size:14px; margin-bottom:18px;}
.stack{display:flex; flex-direction:column; gap:12px; width:260px;}
button.pill{
  border:none; border-radius:16px; padding:16px; font-size:17px; font-weight:700;
  background:var(--gold); color:#161616; cursor:pointer;
}
button.pill:active{transform:scale(.97);}
button.ghost{background:transparent; border:1.5px solid var(--gold); color:var(--gold);}
.hidden{display:none !important;}

/* level menu */
#levelMenu{justify-content:center; min-height:100vh; gap:16px; text-align:center;}
.lvl-desc{color:var(--muted); font-size:13px; max-width:280px; margin:-6px 0 6px;}

/* game */
#game{width:100%; padding-top:14px;}
.topbar{display:flex; justify-content:space-between; align-items:center; width:100%; max-width:480px; margin-bottom:8px;}
.topbtn{
  background:var(--panel); border:1px solid #3a3a3a; color:var(--text);
  border-radius:12px; padding:9px 14px; font-size:13px; font-weight:700; cursor:pointer;
}
h2.gametitle{font-size:20px; color:var(--gold); margin:2px 0 2px; letter-spacing:.5px;}
.stats{font-size:13px; color:var(--muted); margin-bottom:10px; text-align:center;}
.stats b{color:var(--gold);}
canvas{width:100%; max-width:420px; aspect-ratio:1/1; border-radius:10px; touch-action:manipulation;}
.bottombar{display:flex; gap:8px; width:100%; max-width:420px; margin-top:12px;}
.bbtn{
  flex:1; background:var(--panel); border:1.5px solid var(--gold); border-radius:12px;
  padding:12px 4px; text-align:center; cursor:pointer; color:var(--text);
}
.bbtn.disabled{opacity:.45; border-color:#555;}
.bbtn .lbl{font-size:13px; font-weight:700;}
.bbtn .sub{font-size:11px; color:var(--gold); margin-top:2px;}

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
  align-items:center; justify-content:center; z-index:50; padding:20px;
}
.overlay.active{display:flex;}
.modal{
  background:var(--panel2); border:1px solid #3a3a3a; border-radius:16px;
  padding:22px; max-width:360px; width:100%; text-align:center;
}
.modal h3{margin:0 0 10px; color:var(--gold); font-size:19px;}
.modal p{white-space:pre-line; font-size:14.5px; line-height:1.5; color:var(--text); text-align:left; margin:0 0 16px;}
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:#2c2c2e; color:#fff; padding:10px 18px; border-radius:10px; font-size:13.5px;
  z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; max-width:85vw; text-align:center;
}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div id="splash" class="screen active">
  <img class="crest" id="crestImg" alt="knight">
  <h1 class="title" id="tTitle">OT YO'LI</h1>
  <div class="subtitle" id="tSub">Til tanlang</div>
  <div class="stack">
    <button class="pill" onclick="setLang(0)">O‘zbek tili 🇺🇿</button>
    <button class="pill" onclick="setLang(1)">Русский язык 🇷🇺</button>
    <button class="pill" onclick="setLang(2)">English language 🏴</button>
  </div>
</div>

<div id="levelMenu" class="screen">
  <h1 class="title" id="mTitle">OT YO'LI</h1>
  <div class="stack">
    <button class="pill" onclick="startMode(0)" id="btnEasy">OSON</button>
    <div class="lvl-desc" id="descEasy">Erkin, cheklovsiz yurish</div>
    <button class="pill" onclick="startMode(1)" id="btnMed">O‘RTA</button>
    <div class="lvl-desc" id="descMed">Cheksiz bosqichlar, yordamchi nuqtalar bilan</div>
    <button class="pill" onclick="startMode(2)" id="btnHard">QIYIN</button>
    <div class="lvl-desc" id="descHard">Cheksiz bosqichlar, nuqtalarsiz</div>
  </div>
</div>

<div id="game" class="screen">
  <div class="topbar">
    <button class="topbtn" onclick="goMenu()" id="btnMenuTop">ORTGA</button>
    <button class="topbtn" onclick="newGame()" id="btnRestart">QAYTA</button>
  </div>
  <h2 class="gametitle" id="gTitle">OT YO'LI</h2>
  <div class="stats">
    <span id="gVisited">Bosilgan kataklar: 0 / 64</span>
    <div id="gLevel"></div>
  </div>
  <canvas id="board" width="640" height="640"></canvas>
  <div class="bottombar">
    <div class="bbtn" id="bInfo" onclick="showInfo()"><div class="lbl" id="lInfo">INFO</div></div>
    <div class="bbtn" id="bHelp" onclick="doHelp()"><div class="lbl" id="lHelp">YORDAM</div><div class="sub" id="sHelp"></div></div>
    <div class="bbtn" id="bBack" onclick="doBack()"><div class="lbl" id="lBack">ORQAGA</div><div class="sub" id="sBack"></div></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="mdTitle"></h3>
    <p id="mdBody"></p>
    <button class="pill" id="mdBtn" style="width:100%"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

/* ---------- game state ---------- */
const JUMPS = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
let gameMode = 1;
let level = 1;
let visited = new Array(64).fill(false);
let moveNumber = new Array(64).fill(0);
let history_ = [];
let current = -1;
let moves = 0;
let forcedFirstTarget = -1;
let lastYordamTime = 0, lastOrqagaTime = 0;
const COOLDOWN = 60000;

const levelStarts = [];
for (let s=0;s<64;s++){
  const r=Math.floor(s/8), c=s%8;
  for (const [dr,dc] of JUMPS){
    const nr=r+dr, nc=c+dc;
    if (nr>=0&&nr<8&&nc>=0&&nc<8) levelStarts.push([s, nr*8+nc]);
  }
}

function idx(r,c){return r*8+c;}
function inb(r,c){return r>=0&&r<8&&c>=0&&c<8;}
function degreeOf(i){
  const r=Math.floor(i/8), c=i%8; let n=0;
  for (const [dr,dc] of JUMPS){ const nr=r+dr,nc=c+dc; if(inb(nr,nc) && !visited[idx(nr,nc)]) n++; }
  return n;
}
function legalMove(from,to){
  if (to<0||to>=64||visited[to]) return false;
  if (forcedFirstTarget!==-1 && to!==forcedFirstTarget) return false;
  const r1=Math.floor(from/8), c1=from%8, r2=Math.floor(to/8), c2=to%8;
  const dr=Math.abs(r1-r2), dc=Math.abs(c1-c2);
  return (dr===2&&dc===1)||(dr===1&&dc===2);
}
function hasMove(){
  if (current<0) return true;
  const r=Math.floor(current/8), c=current%8;
  for (const [dr,dc] of JUMPS){ const nr=r+dr,nc=c+dc; if(inb(nr,nc) && !visited[idx(nr,nc)]) return true; }
  return false;
}
function findBestMove(){
  if (forcedFirstTarget!==-1) return forcedFirstTarget;
  if (current===-1){
    let best=-1, bestDeg=9;
    for (let i=0;i<64;i++){ if(visited[i]) continue; const d=degreeOf(i); if(d<bestDeg){bestDeg=d; best=i;} }
    return best;
  }
  const r=Math.floor(current/8), c=current%8;
  let best=-1, bestDeg=9;
  for (const [dr,dc] of JUMPS){
    const nr=r+dr,nc=c+dc;
    if(inb(nr,nc)){ const ni=idx(nr,nc); if(!visited[ni]){ const d=degreeOf(ni); if(d<bestDeg){bestDeg=d; best=ni;} } }
  }
  return best;
}
function resetBoard(){
  visited.fill(false); moveNumber.fill(0); history_=[]; current=-1; moves=0; forcedFirstTarget=-1;
}
function startLevel(){
  resetBoard();
  if (gameMode===0) { render(); return; }
  const i = (level-1) % levelStarts.length;
  const [start,target] = levelStarts[i];
  applyMoveTo(start, true);
  forcedFirstTarget = target;
  render();
}
function newGame(){ startLevel(); toast(t('restarted')); }
function beep(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='triangle'; o.frequency.value=520; g.gain.value=0.08;
    o.connect(g); g.connect(ac.destination); o.start();
    o.frequency.exponentialRampToValueAtTime(280, ac.currentTime+0.1);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.15);
    o.stop(ac.currentTime+0.16);
  }catch(e){}
}
function applyMoveTo(i, silent){
  current=i; visited[i]=true; moves++; moveNumber[i]=moves;
  history_.push(i);
  if (forcedFirstTarget!==-1 && i===forcedFirstTarget) forcedFirstTarget=-1;
  if (!silent){ beep(); if(window.Telegram?.WebApp?.HapticFeedback) Telegram.WebApp.HapticFeedback.impactOccurred('light'); }
  render();
  checkGameEnd();
}
function checkGameEnd(){
  if (moves===64){
    if (gameMode===0){
      showModal(t('victTitle'), t('victBody'), t('playAgain'), ()=>{ hideModal(); startLevel(); });
    } else {
      showModal(L.lvlDoneTitle(level)[lang], L.lvlDoneBody(level)[lang], t('nextLevel'), ()=>{ hideModal(); level++; startLevel(); });
    }
    return;
  }
  if (!hasMove()){
    showModal(t('overTitle'), L.overBody(level,moves)[lang], t('playAgain'), ()=>{ hideModal(); newGame(); });
  }
}

/* ---------- modal / toast ---------- */
function showModal(title, body, btnText, onClick){
  mdTitle.textContent=title; mdBody.textContent=body; mdBtn.textContent=btnText;
  mdBtn.onclick=onClick; overlay.classList.add('active');
}
function hideModal(){ overlay.classList.remove('active'); }
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

/* ---------- render ---------- */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
function fitSize(img, cell, maxH, maxW){
  const ar = img.naturalWidth / img.naturalHeight;
  let h = cell*maxH, w = h*ar;
  if (w > cell*maxW){ w = cell*maxW; h = w/ar; }
  return {w,h};
}
function render(){
  const W=canvas.width, H=canvas.height, cell=W/8;
  ctx.clearRect(0,0,W,H);
  if (imagesReady===4) ctx.drawImage(imgBoard, 0, 0, W, H);
  else { ctx.fillStyle='#7a5c3a'; ctx.fillRect(0,0,W,H); }

  for (let r=0;r<8;r++) for (let c=0;c<8;c++){
    const i=idx(r,c), x=c*cell, y=r*cell;
    if (!visited[i]){
      if (imagesReady===4){
        const img = ((r+c)%2===0) ? imgPawnW : imgPawnB;
        const {w:pw, h:ph} = fitSize(img, cell, 0.66, 0.56);
        ctx.drawImage(img, x+(cell-pw)/2, y+cell*0.86-ph, pw, ph);
      }
    } else {
      ctx.font = `700 ${cell*0.34}px -apple-system,sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.lineWidth=cell*0.06; ctx.strokeStyle='#fff';
      ctx.strokeText(String(moveNumber[i]), x+cell/2, y+cell/2+cell*0.02);
      ctx.fillStyle='#111';
      ctx.fillText(String(moveNumber[i]), x+cell/2, y+cell/2+cell*0.02);
    }
  }
  if (current>=0){
    const cr=Math.floor(current/8), cc=current%8;
    if (gameMode!==2){
      for (const [dr,dc] of JUMPS){
        const nr=cr+dr, nc=cc+dc;
        if (inb(nr,nc)){
          const ni=idx(nr,nc);
          if (!visited[ni] && (forcedFirstTarget===-1 || ni===forcedFirstTarget)){
            ctx.beginPath();
            ctx.arc(nc*cell+cell/2, nr*cell+cell/2, cell*0.12, 0, Math.PI*2);
            ctx.fillStyle='#ffd700'; ctx.fill();
          }
        }
      }
    }
    const x=cc*cell, y=cr*cell;
    if (imagesReady===4){
      const {w:kw, h:kh} = fitSize(imgKnight, cell, 0.8, 0.66);
      ctx.drawImage(imgKnight, x+(cell-kw)/2, y+cell*0.94-kh, kw, kh);
    }
  }
  gVisited.textContent = t('visited') + moves + ' / 64';
  gLevel.textContent = gameMode!==0 ? (t('level') + level) : '';
  gLevel.style.display = gameMode!==0 ? 'block':'none';
}

function remainingSeconds(last){
  if (!last) return 0;
  const passed = Date.now()-last;
  const remain = Math.floor((COOLDOWN-passed)/1000);
  return remain>0 ? remain+1 : 0;
}
function updateCooldownUI(){
  const ry=remainingSeconds(lastYordamTime), rb=remainingSeconds(lastOrqagaTime);
  bHelp.classList.toggle('disabled', ry>0);
  bBack.classList.toggle('disabled', rb>0);
  sHelp.textContent = ry>0 ? ry+t('sSuffix') : '';
  sBack.textContent = rb>0 ? rb+t('sSuffix') : '';
}
setInterval(updateCooldownUI, 1000);

/* ---------- controls ---------- */
canvas.addEventListener('click', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const scale = canvas.width/rect.width;
  const x = (e.clientX-rect.left)*scale, y=(e.clientY-rect.top)*scale;
  const cell = canvas.width/8;
  const col = Math.floor(x/cell), row = Math.floor(y/cell);
  const selected = idx(row,col);
  if (current===-1){ applyMoveTo(selected); return; }
  if (legalMove(current, selected)) applyMoveTo(selected);
  else toast(t('illegal'));
});
function doHelp(){
  const remain = remainingSeconds(lastYordamTime);
  if (remain>0){ toast(t('helpWait')+remain+t('helpWaitEnd')); return; }
  const best = findBestMove();
  if (best===-1){ toast(t('noMove')); return; }
  lastYordamTime = Date.now();
  applyMoveTo(best);
}
function doBack(){
  const remain = remainingSeconds(lastOrqagaTime);
  if (remain>0){ toast(t('backWait')+remain+t('backWaitEnd')); return; }
  if (history_.length<=1){ toast(t('noBack')); return; }
  const last = history_.pop();
  visited[last]=false; moveNumber[last]=0; moves--;
  current = history_.length ? history_[history_.length-1] : -1;
  lastOrqagaTime = Date.now();
  render();
}
function showInfo(){ showModal(t('infoTitle'), t('infoBody'), t('gotIt'), hideModal); }
function goMenu(){
  document.getElementById('game').classList.remove('active');
  document.getElementById('levelMenu').classList.add('active');
}
function startMode(m){
  gameMode = m; level = 1;
  document.getElementById('levelMenu').classList.remove('active');
  document.getElementById('game').classList.add('active');
  startLevel();
}

/* ---------- init ---------- */
(function init(){
  if (window.Telegram && window.Telegram.WebApp){
    try{ Telegram.WebApp.ready(); Telegram.WebApp.expand(); }catch(e){}
  }
})();
</script>
